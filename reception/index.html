body:not(.rdy) .amb{display:none}
/* intro */
#intro{position:fixed;inset:0;z-index:10;overflow:hidden;cursor:pointer;--W:min(92vw,130vh,720px);--H:calc(var(--W)/2.33);--u:calc(var(--H)*.95);--fn:.56;--pv:54%;--sl:-70%;background:radial-gradient(ellipse 70% 40% at 50% 52%,#3f8a84aa,#0000 70%),radial-gradient(ellipse at 50% 40%,#1f5251,#06191a 80%);transition:opacity 1s ease,visibility 0s 1s}
#intro.done{opacity:0;visibility:hidden}
.gr,.tp,.sk{position:absolute;left:0;right:0;text-align:center;z-index:6;font:500 14px 'Cormorant Garamond',serif;letter-spacing:.18em;text-transform:uppercase;color:#f0d9b0}
.gr{bottom:calc(50% + var(--H)*.38 + 24px);transition:opacity .6s}
.tp{bottom:6%;font-size:15px;transition:opacity .6s}.tp span{display:inline-block;animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
.sk{bottom:6%;font-size:11px;opacity:0;pointer-events:none}
.go .gr,.go .tp{opacity:0}.go .sk{opacity:.75;transition:opacity .6s .9s}.done .sk{opacity:0}
.sh{position:absolute;left:50%;top:50%;width:calc(var(--W)*1.3);height:26px;transform:translate(-50%,calc(var(--H)*.62 + 2px));background:radial-gradient(ellipse,#000b,#0000 70%);filter:blur(6px)}
.go .sh{animation:shd 1.1s ease-in-out}
@keyframes shd{50%{transform:translate(-50%,calc(var(--H)*.62 + 2px)) scaleX(.55);opacity:.6}}
.env{position:absolute;left:50%;top:50%;width:var(--W);height:var(--H);transform:translate(-50%,-38%);perspective:1800px;will-change:transform;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(-50%,-38%)}50%{transform:translate(-50%,calc(-38% - 6px))}}
.go .env{animation-play-state:paused}
.flip{position:absolute;inset:0;transform-style:preserve-3d}
.go .flip{animation:flp 1.1s forwards}
@keyframes flp{0%{transform:rotateY(0) scale(1);animation-timing-function:cubic-bezier(.5,0,.9,.6)}50%{transform:rotateY(90deg) scale(1.08);animation-timing-function:cubic-bezier(.1,.4,.5,1)}100%{transform:rotateY(180deg) scale(1)}}
.face{position:absolute;inset:0;border-radius:3px;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--mint) 0 0/110px 110px}
.back{transform:rotateY(180deg)}
.front{box-shadow:0 22px 40px #000a}
.front:after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(115deg,#fff5,#0000 40%,#0002);pointer-events:none}
.f{position:absolute;display:block;height:auto}.art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.foil{background:var(--foil);background-size:260% 100%;aspect-ratio:1/1.15}
.go .foil{animation:shn 1.1s ease-in-out}
@keyframes shn{to{background-position:100% 0}}
.vt{position:absolute;left:7%;top:4.5%;height:28%;writing-mode:vertical-rl;transform:rotate(180deg);font:400 calc(var(--W)*.072) 'Great Vibes',cursive;white-space:nowrap}
.cap2{position:absolute;left:25%;width:70%;top:30.6%;text-align:center;font:400 calc(var(--W)*.044) 'Great Vibes',cursive}
.eb{position:absolute;inset:0;border-radius:3px;box-shadow:0 22px 40px #000a;background:var(--mint) 0 0/110px 110px}
.ci{position:absolute;z-index:1;left:6%;top:5%;width:88%;height:88%;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;gap:6px;color:var(--ink);background:var(--linen),linear-gradient(#fffaf0,#efe2c4);background-blend-mode:multiply,normal;box-shadow:inset 0 0 0 4px #fbf3e0,inset 0 0 0 5px #b9702f99,0 -4px 14px #0005;transition:transform 1.1s cubic-bezier(.4,0,.2,1) 2.2s;text-align:center}
.ci small{font:500 calc(var(--u)*.075) 'Cormorant Garamond',serif;letter-spacing:.16em;text-transform:uppercase;color:#7a5a3a}
.ci b{font:400 calc(var(--u)*.22)/1.05 'Great Vibes',cursive}
.go .ci{transform:translateY(var(--sl))}
.pk{position:absolute;inset:0;z-index:2;clip-path:polygon(0 0,50% var(--pv),100% 0,100% 100%,0 100%);border-radius:3px;background:var(--mint) 0 0/110px 110px}
.pk:after,.ff:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff26,#0000 40%,#0003)}
.st{position:absolute;inset:0;width:100%;height:100%}
.fp{position:absolute;left:0;top:0;width:100%;height:calc(var(--fn)*100%);z-index:3;transform-origin:50% 0;transition:transform .6s cubic-bezier(.55,0,.8,.5) 1.35s}
.go .fp{transform:scaleY(0)}
.ff{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--mint) 0 0/110px 110px}
.fo{position:absolute;z-index:0;left:0;top:calc(var(--H)*var(--fn)*-1);width:100%;height:calc(var(--H)*var(--fn));clip-path:polygon(0 100%,100% 100%,50% 0);transform-origin:50% 100%;transform:scaleY(0);background:var(--linen),linear-gradient(0deg,#e9dcc0,#f8f0dc);background-blend-mode:multiply,normal;transition:transform .7s cubic-bezier(.2,.6,.3,1) 1.85s}
.go .fo{transform:scaleY(1)}
.sl{position:absolute;z-index:5;left:50%;top:calc(var(--fn)*100%);width:calc(var(--u)*.28);transform:translate(-50%,-50%);filter:drop-shadow(0 5px 4px #0008)}
.go .sl{animation:sld .8s cubic-bezier(.3,0,.2,1) .95s forwards}
@keyframes sld{0%{transform:translate(-50%,-50%);opacity:1}35%{transform:translate(-50%,-64%) scale(1.1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-110%) scale(.85) rotate(-10deg);opacity:0}}
/* card */
#main{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.fit{width:min(92vw,400px);transform-origin:50% 50%}
.card{position:relative;text-align:center;color:var(--ink);border-radius:4px;padding:36px 22px 28px;background:var(--linen),radial-gradient(ellipse at 50% 0,#fffaf0,#f1e5c8);background-blend-mode:multiply,normal;box-shadow:0 30px 60px #000a,inset 0 0 0 9px #fbf4e2,inset 0 0 0 10px #b9702faa;opacity:0;transform:scale(.97);transition:opacity 1s ease,transform 1.2s cubic-bezier(.22,1,.36,1)}
.card.show{opacity:1;transform:none}
.co{position:absolute;width:64px;height:64px}.co.a{top:10px;left:10px}.co.b{top:10px;right:10px;transform:scaleX(-1)}.co.c{bottom:10px;left:10px;transform:scaleY(-1)}.co.d{bottom:10px;right:10px;transform:scale(-1)}
.rv{opacity:0;transform:translateY(20px);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1)}
.show .rv{opacity:1;transform:none}
.gan{font:500 12px 'Cormorant Garamond',serif;letter-spacing:.14em;color:#8a5a2a}
.hd1{font:400 42px/1.1 'Great Vibes',cursive;margin:6px 0 2px}
.cap{font:500 11px 'Cormorant Garamond',serif;letter-spacing:.3em;text-transform:uppercase;color:#7a5a3a}
.sm{font:400 16px/1.5 'Cormorant Garamond',serif;color:#5a4636;margin:10px 0 6px}
.nm{font:400 38px/1.15 'Great Vibes',cursive;color:#1d5a58;white-space:nowrap}.nm i{font:500 17px 'Cormorant Garamond',serif;font-style:normal;color:var(--cu);margin:0 .3em}
.fn{font:500 10px 'Cormorant Garamond',serif;letter-spacing:.14em;color:#6a5a4a;white-space:nowrap;margin-top:2px}
.orn{width:130px;height:1px;background:linear-gradient(90deg,#0000,#b9702f,#0000);margin:14px auto;position:relative}
.orn:after{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);background:#f7eed8;padding:0 8px;color:#b9702f;font-size:8px}
.evs{display:flex;justify-content:center}
.e{flex:1;padding:0 8px}.e+.e{border-left:1px solid #b9702f77}
.dn{display:block;font:600 52px/1 'Cormorant Garamond',serif;color:var(--cu);margin:4px 0 2px}
.mo{font:500 13px 'Cormorant Garamond',serif;letter-spacing:.22em}.wd{font:400 11px 'Jost',sans-serif;letter-spacing:.2em;color:#5a4636;margin-top:3px}
.bs{font:400 12px 'Cormorant Garamond',serif;letter-spacing:.06em;color:#7a5a3a;margin-top:2px}
.tv{font:400 12px 'Jost',sans-serif;letter-spacing:.06em;color:#5a4636;margin-top:5px}
.msg{font:400 15px/1.45 'Cormorant Garamond',serif;color:#5a4636;margin-top:14px}
.cd{display:flex;justify-content:center;margin-top:12px}
.cd div{padding:0 12px;border-left:1px solid #b9702f66}.cd div:first-child{border:0}
.cd b{display:block;font:500 24px 'Cormorant Garamond',serif;color:var(--cu)}
.cd span{font:400 9px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#6a5a4a}

.lk{display:inline-block;margin-top:8px;padding:11px 18px;position:relative;z-index:5;-webkit-tap-highlight-color:#b9702f33;border:1px solid #b9702f99;border-radius:20px;font:400 11px 'Jost',sans-serif;letter-spacing:.08em;color:var(--cu);text-decoration:none}
.e{display:flex;flex-direction:column;align-items:center}.e .bs{margin-bottom:8px}.e .lk{margin-top:auto}.mo{white-space:nowrap;font-size:12px;letter-spacing:.14em}

.fr,.fl{position:absolute;inset:0}.fr{display:none}
.hw{position:absolute;left:3.5%;bottom:2.5%;width:36%}.gto{font:italic 600 calc(var(--u)*.07)/1.15 'Cormorant Garamond',serif;color:#8a5f1c;text-shadow:0 1px 0 #ffffff55;overflow-wrap:anywhere}.ht{position:static;width:auto;font:400 calc(var(--u)*.085)/1.1 'Great Vibes',cursive}
@media (orientation:landscape) and (min-aspect-ratio:11/10){
#intro{--sl:-52%}
.fit{width:min(94vw,820px)}
.card{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;align-items:center;padding:30px 28px 24px}
.card .orn{display:none}.col.r{border-left:1px solid #b9702f77;padding-left:20px}
.hd1{font-size:38px}.sm{margin:8px 0 4px;font-size:15px}.nm{font-size:34px}
}
.gst{font:400 30px/1.2 'Great Vibes',cursive;color:#8a4f1e;margin:2px 0 0;max-width:92%;overflow-wrap:anywhere}</style>
</head>
