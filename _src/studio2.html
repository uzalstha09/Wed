<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}@font-face{font-family:'Great Vibes';src:url(FONTDIR/great-vibes/files/great-vibes-latin-400-normal.woff2)}svg{display:block}</style></head><body>
<div id="out"></div>
<script>
/* white embossed paper style */
var C={paper:'#e8e5ee',paper2:'#dedae6',paper3:'#f1eff5',em:'#f7f6fa',shd:'#8b84a1',gold:'#a8955e',wax:'#f3f1ee'};
var q=new URLSearchParams(location.search),A=q.get('a')||'base',W=+(q.get('w')||450),H=+(q.get('h')||975);
var seed=+(q.get('seed')||11),rnd=function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function f(n){return (+n).toFixed(1)}
var DEFS='<defs>'+
/* emboss: raised white relief, soft cool shadow */
'<filter id="emb" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">'+
 '<feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>'+
 '<feSpecularLighting in="b" surfaceScale="1.8" specularConstant=".38" specularExponent="24" lighting-color="#ffffff" result="sp"><feDistantLight azimuth="235" elevation="38"/></feSpecularLighting>'+
 '<feComposite in="sp" in2="SourceAlpha" operator="in" result="sp2"/>'+
 '<feDiffuseLighting in="b" surfaceScale="1.8" diffuseConstant="1.06" lighting-color="#ffffff" result="df"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting>'+
 '<feComposite in="df" in2="SourceAlpha" operator="in" result="df2"/>'+
 '<feBlend in="SourceGraphic" in2="df2" mode="multiply" result="m"/>'+
 '<feComposite in="m" in2="sp2" operator="arithmetic" k2="1" k3=".22" result="lit"/>'+
 '<feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="sb"/><feOffset in="sb" dx="1.2" dy="1.8" result="so"/>'+
 '<feFlood flood-color="'+C.shd+'" flood-opacity=".2"/><feComposite in2="so" operator="in" result="sh"/>'+
 '<feMerge><feMergeNode in="sh"/><feMergeNode in="lit"/></feMerge></filter>'+
/* debossed fold crease */
'<filter id="crease" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".7"/></filter>'+
'<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>'+
'<filter id="paperTex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer></filter>'+
'<filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="4" result="o"/><feFlood flood-color="#4a4458" flood-opacity=".28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
'<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
'</defs>';

/* ---------- botanical motifs ---------- */
function leaf(x,y,l,a,w){w=w||.46;var c=Math.cos(a),s=Math.sin(a),k=l*w;var tip=[x+c*l,y+s*l],m1=[x+c*l*.45-s*k,y+s*l*.45+c*k],m2=[x+c*l*.45+s*k,y+s*l*.45-c*k];
 return '<path d="M'+f(x)+' '+f(y)+'Q'+f(m1[0])+' '+f(m1[1])+' '+f(tip[0])+' '+f(tip[1])+'Q'+f(m2[0])+' '+f(m2[1])+' '+f(x)+' '+f(y)+'Z"/>'}
function blossom(x,y,r,rot,n){n=n||5;var s='';for(var i=0;i<n;i++){var a=rot+i*Math.PI*2/n,cx=x+Math.cos(a)*r*.55,cy=y+Math.sin(a)*r*.55;s+='<ellipse cx="'+f(cx)+'" cy="'+f(cy)+'" rx="'+f(r*.52)+'" ry="'+f(r*.4)+'" transform="rotate('+f(a*57.3)+' '+f(cx)+' '+f(cy)+')"/>'}return s+'<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(r*.22)+'"/>'}
/* layered peony / rose: rings of rounded petals, each ring its own embossed group so they stack in relief */
function peony(x,y,r){var g='';var rings=[[1,8,.62],[.64,7,.58],[.34,5,.5]];
 rings.forEach(function(rg,ri){var R=r*rg[0],n=rg[1],s='';var off=rnd()*6;for(var i=0;i<n;i++){var a=off+i*Math.PI*2/n,cx=x+Math.cos(a)*R*.55,cy=y+Math.sin(a)*R*.55;
   s+='<path d="M'+f(x+Math.cos(a)*R*.15)+' '+f(y+Math.sin(a)*R*.15)+'C'+f(x+Math.cos(a-.78)*R*1.18)+' '+f(y+Math.sin(a-.78)*R*1.18)+' '+f(x+Math.cos(a+.78)*R*1.18)+' '+f(y+Math.sin(a+.78)*R*1.18)+' '+f(x+Math.cos(a)*R*.15)+' '+f(y+Math.sin(a)*R*.15)+'Z"/>'}
  g+='<g filter="url(#emb)" fill="'+C.em+'">'+s+'</g>'});
 g+='<g filter="url(#emb)" fill="'+C.em+'"><circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(r*.13)+'"/></g>';return g}
/* stem with alternate leaves; returns embossed group */
function stem(pts,leafL,every){var s='<path d="M'+pts.map(function(p){return f(p[0])+' '+f(p[1])}).join('L')+'" fill="none" stroke="'+C.em+'" stroke-width="1.5" stroke-linecap="round"/>';
 for(var i=1;i<pts.length-1;i++){var a=Math.atan2(pts[i+1][1]-pts[i-1][1],pts[i+1][0]-pts[i-1][0]);var side=i%2?1:-1;var sz=leafL*(.75+rnd()*.35)*(1-i/pts.length*.4);if(i%2==0||leafL>14)s+=leaf(pts[i][0],pts[i][1],sz,a+side*.62,.4)}
 var e=pts[pts.length-1],d=Math.atan2(e[1]-pts[pts.length-2][1],e[0]-pts[pts.length-2][0]);s+=leaf(e[0],e[1],leafL*.55,d,.5);
 return s}
function curvePts(x0,y0,x1,y1,bend,n){var p=[];for(var i=0;i<=n;i++){var t=i/n,nx=-(y1-y0),ny=x1-x0,l=Math.hypot(nx,ny);p.push([x0+(x1-x0)*t+nx/l*bend*Math.sin(t*Math.PI),y0+(y1-y0)*t+ny/l*bend*Math.sin(t*Math.PI)])}return p}
function spray(x,y,ang,L,bend){var p=curvePts(x,y,x+Math.cos(ang)*L,y+Math.sin(ang)*L,bend,16);var s=stem(p,L*.22,1);var e=p[p.length-1];s+=blossom(e[0],e[1],L*.07,rnd()*6);
 for(var i=5;i<p.length-2;i+=5){var a=Math.atan2(p[i+1][1]-p[i-1][1],p[i+1][0]-p[i-1][0]);var b=[p[i][0]+Math.cos(a+1.2)*L*.11,p[i][1]+Math.sin(a+1.2)*L*.11];s+='<path d="M'+f(p[i][0])+' '+f(p[i][1])+'L'+f(b[0])+' '+f(b[1])+'" stroke="'+C.em+'" stroke-width="1.1" fill="none"/>'+blossom(b[0],b[1],L*.04,rnd()*6,6)}
 return '<g filter="url(#emb)" fill="'+C.em+'">'+s+'</g>'}
function berries(x,y,ang,L){var s='';var p=curvePts(x,y,x+Math.cos(ang)*L,y+Math.sin(ang)*L,L*.12,8);s+='<path d="M'+p.map(function(q){return f(q[0])+' '+f(q[1])}).join('L')+'" stroke="'+C.em+'" stroke-width="1.3" fill="none"/>';for(var i=2;i<p.length;i+=2)s+='<circle cx="'+f(p[i][0])+'" cy="'+f(p[i][1])+'" r="2.4"/>';return '<g filter="url(#emb)" fill="'+C.em+'">'+s+'</g>'}

/* bouquet: centre peony, side flowers, radiating sprays (width ~ span) */
function bouquet(cx,cy,span,big){var s='';var n=big?12:10;
 for(var i=0;i<n;i++){var a=-Math.PI+i*(Math.PI*2)/n+(rnd()-.5)*.3;var L=span*(.27+rnd()*.1)*(Math.abs(Math.cos(a))*.7+.3);s+=spray(cx+Math.cos(a)*span*.06,cy+Math.sin(a)*span*.06,a,L,(rnd()-.5)*L*.25)}
 for(var i=0;i<6;i++){var a=rnd()*Math.PI*2;s+=berries(cx+Math.cos(a)*span*.12,cy+Math.sin(a)*span*.1,a,span*.16)}
 var side=big?[[-.17,.03,.085],[.18,.02,.08],[-.07,-.11,.07],[.08,-.1,.065],[.09,.12,.07],[-.1,.13,.065],[-.27,.06,.055],[.28,.07,.05],[0,.17,.055],[0,-.17,.05]]:[[-.15,.02,.075],[.15,.03,.07],[-.05,-.12,.055],[.06,-.11,.05],[-.24,.05,.045],[.24,.05,.045]];
 side.forEach(function(d){s+=peony(cx+d[0]*span,cy+d[1]*span,span*d[2])});
 s+=peony(cx,cy,span*(big?.13:.11));
 return s}
/* vertical vine for side flaps */
function vine(x,y0,y1,dir){var s='';var p=[];var n=56;for(var i=0;i<=n;i++){var t=i/n;p.push([x+Math.sin(t*Math.PI*2.2)*10*dir,y0+(y1-y0)*t])}
 var g=stem(p,19,1);
 for(var i=3;i<n;i+=4){var a=(i%8<4?-1:1)*dir;g+=leaf(p[i][0],p[i][1],22,(a>0?-.5:Math.PI+.5),.42)+(i%8==3?blossom(p[i][0]+a*14,p[i][1]-8,6,i,6):'')}
 s+='<g filter="url(#emb)" fill="'+C.em+'">'+g+'</g>';
 [[.18,.06],[.42,.07],[.68,.065],[.9,.05]].forEach(function(d){var i=Math.round(d[0]*n);s+=peony(p[i][0],p[i][1],W*d[1]*.55)});
 s+=blossom(p[n][0],p[n][1]+6,7,0)?'<g filter="url(#emb)" fill="'+C.em+'">'+blossom(p[n][0],p[n][1]+4,6,0)+blossom(p[0][0],p[0][1]-4,6,1)+'</g>':'';
 return s}

function paper(fill){return '<rect width="'+W+'" height="'+H+'" fill="'+(fill||C.paper)+'"/><g filter="url(#soft)" style="filter:blur(60px)"><ellipse cx="'+W*.4+'" cy="'+H*.35+'" rx="'+W*.6+'" ry="'+H*.3+'" fill="'+C.paper3+'" opacity=".8"/></g><rect width="'+W+'" height="'+H+'" fill="#000" filter="url(#paperTex)"/>'}

/* geometry */
var AX=W/2,AY=H*.445,BY=H*.475; // top flap apex, bottom flap apex
var body='';
if(A==='base'){ // body: side + bottom flaps, florals; top triangle shows envelope inside (shaded)
 body=paper();
 body+='<defs><linearGradient id="ins" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e1ea"/><stop offset="1" stop-color="#d2cddb"/></linearGradient><clipPath id="botclip"><polygon points="-2,'+(H+2)+' '+AX+','+BY+' '+(W+2)+','+(H+2)+'"/></clipPath></defs>';
 body+='<polygon points="0,0 '+W+',0 '+AX+','+AY+'" fill="url(#ins)"/>';
 body+='<polyline points="0,0 '+AX+','+f(H*.47)+' '+W+',0" fill="none" stroke="#b9b2c6" stroke-width="1" filter="url(#crease)"/>';
 body+='<g filter="url(#drop)"><g clip-path="url(#botclip)">'+paper()+'</g></g>';
 body+='<polyline points="0,'+H+' '+AX+','+BY+' '+W+','+H+'" fill="none" stroke="#ffffff" stroke-width="1.1" opacity=".75"/>';
 if(!q.get('nof')){body+=vine(W*.16,H*.30,H*.74,1)+vine(W*.84,H*.30,H*.74,-1);
 body+=bouquet(W*.5,H*.79,W*.98,true);}
}
if(A==='flap'){ // top flap front
 body='<clipPath id="fc"><polygon points="-2,-2 '+(W+2)+',-2 '+AX+','+AY+'"/></clipPath><g filter="url(#drop)"><g clip-path="url(#fc)">'+paper('#ebe8f1')+'</g></g>';
 if(!q.get('nof'))body+='<g clip-path="url(#fc)">'+bouquet(W*.5,H*.17,W*.84,false)+'</g>';
 body+='<polyline points="0,0 '+AX+','+AY+' '+W+',0" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".7"/>';
}
if(A==='flapback'){ // inside of top flap
 body='<clipPath id="fc"><polygon points="-2,-2 '+(W+2)+',-2 '+AX+','+AY+'"/></clipPath><g clip-path="url(#fc)"><rect width="'+W+'" height="'+H+'" fill="#e2dee9"/><g style="filter:blur(50px)"><ellipse cx="'+W*.5+'" cy="'+H*.35+'" rx="'+W*.35+'" ry="'+H*.12+'" fill="#f6f4fa"/></g><rect width="'+W+'" height="'+H+'" fill="#000" filter="url(#paperTex)"/></g>';
}
if(A==='glow'){ // bright version of florals for the shimmer
 C.em='#ffffff';var g=vine(W*.16,H*.30,H*.74,1)+vine(W*.84,H*.30,H*.74,-1)+bouquet(W*.5,H*.79,W*.98,true);
 body='<g filter="url(#glow)" opacity=".95">'+g.replace(/filter="url\(#emb\)"/g,'')+'</g>';}
if(A==='hbase'){body=vine(W*.16,H*.30,H*.74,1)+vine(W*.84,H*.30,H*.74,-1)+bouquet(W*.5,H*.79,W*.98,true)}
if(A==='hflap'){body=bouquet(W*.5,H*.17,W*.84,false)}
if(A==='glowflap'){C.em='#ffffff';var g=bouquet(W*.5,H*.17,W*.84,false);body='<g filter="url(#glow)" opacity=".95">'+g.replace(/filter="url\(#emb\)"/g,'')+'</g>'}
if(A==='seal'){ // white wax seal with gold line wreath
 var cx=W/2,cy=H/2,R=Math.min(W,H)*.42,pts=[];for(var i=0;i<160;i++){var t=i/160*Math.PI*2,k=1+.045*Math.sin(t*6+1)+.03*Math.sin(t*11+2)+.02*Math.sin(t*17);pts.push(f(cx+R*k*Math.cos(t))+' '+f(cy+R*k*.96*Math.sin(t)))}
 var wax='M'+pts.join('L')+'Z';
 var wr='';for(var i=0;i<26;i++){var a=i/26*Math.PI*2;var x=cx+Math.cos(a)*R*.56,y=cy+Math.sin(a)*R*.56;wr+=leaf(x,y,R*.13,a+Math.PI/2+(i%2?.45:-.45),.32)}
 var fl='';for(var i=0;i<8;i++){var a=i/8*Math.PI*2;fl+='<path d="M'+f(cx)+' '+f(cy)+'C'+f(cx+Math.cos(a-.4)*R*.34)+' '+f(cy+Math.sin(a-.4)*R*.34)+' '+f(cx+Math.cos(a+.4)*R*.34)+' '+f(cy+Math.sin(a+.4)*R*.34)+' '+f(cx)+' '+f(cy)+'Z"/>'}
 for(var i=0;i<8;i++){var a=i/8*Math.PI*2+.39;fl+='<path d="M'+f(cx)+' '+f(cy)+'C'+f(cx+Math.cos(a-.35)*R*.22)+' '+f(cy+Math.sin(a-.35)*R*.22)+' '+f(cx+Math.cos(a+.35)*R*.22)+' '+f(cy+Math.sin(a+.35)*R*.22)+' '+f(cx)+' '+f(cy)+'Z"/>'}
 body='<g style="filter:drop-shadow(0 6px 8px #5a536b40)"><path d="'+wax+'" fill="#ecebe8"/></g><g filter="url(#emb)"><path d="'+wax+'" fill="'+C.wax+'"/></g>'+
  '<g filter="url(#emb)"><circle cx="'+cx+'" cy="'+cy+'" r="'+f(R*.74)+'" fill="#f6f5f2"/></g>'+
  '<circle cx="'+cx+'" cy="'+cy+'" r="'+f(R*.7)+'" fill="#f7f6f3"/>'+
  '<g fill="none" stroke="'+C.gold+'" stroke-width="1.3" stroke-linejoin="round">'+wr.replace(/<path /g,'<path ')+'</g>'+
  '<g fill="none" stroke="'+C.gold+'" stroke-width="1.2">'+fl+'<circle cx="'+cx+'" cy="'+cy+'" r="'+f(R*.06)+'"/></g>'+
  '<circle cx="'+cx+'" cy="'+cy+'" r="'+f(R*.7)+'" fill="none" stroke="#d9d7d2" stroke-width="1"/>';
}

if(A==='arch'||A==='archglow'){ // carved arch frame overlay with roses + lanterns; window transparent
 var x0=W*.13,x1=W*.87,cx=W/2,ys=H*.33,ya=H*.075,yb=H*1.02;
 function archPath(dx,dy){var L=x0+dx,R=x1-dx,S=ys+dy*.4,Ap=ya+dy;var p='M'+f(L)+' '+f(yb)+'L'+f(L)+' '+f(S);
  // left half: lobed ogee from springline to apex
  var lobes=4,pts=[];for(var i=0;i<=lobes;i++){var t=i/lobes;var x=L+(cx-L)*Math.pow(t,1.15),y=S-(S-Ap)*(Math.sin(t*Math.PI/2)*.92+t*.08);pts.push([x,y])}
  for(var i=1;i<=lobes;i++){var a=pts[i-1],b=pts[i];var r=Math.hypot(b[0]-a[0],b[1]-a[1])*.58;p+='A'+f(r)+' '+f(r)+' 0 0 1 '+f(b[0])+' '+f(b[1])}
  var rp=pts.map(function(q){return [2*cx-q[0],q[1]]}).reverse();
  for(var i=1;i<=lobes;i++){var a=rp[i-1],b=rp[i];var r=Math.hypot(b[0]-a[0],b[1]-a[1])*.58;p+='A'+f(r)+' '+f(r)+' 0 0 1 '+f(b[0])+' '+f(b[1])}
  p+='L'+f(R)+' '+f(yb)+'Z';return p}
 var win=archPath(0,0);
 var frame='<path d="M-5 -5H'+(W+5)+'V'+(H+5)+'H-5Z '+win+'" fill-rule="evenodd" fill="#efe9e7"/>';
 body='<defs><clipPath id="frm"><path d="M-5 -5H'+(W+5)+'V'+(H+5)+'H-5Z '+win+'" clip-rule="evenodd"/></clipPath></defs>';
 body+='<g filter="url(#drop)">'+frame+'</g><g clip-path="url(#frm)">'+paper('#ede7e5')+'</g>';
 // carved mouldings: offset arch lines (embossed)
 var mould='';[8,16,26].forEach(function(d,i){mould+='<path d="'+archPath(-d,-d*1.1).replace(/Z$/,'')+'" fill="none" stroke="#f8f5f3" stroke-width="'+(i==1?3.2:2)+'"/>'});
 body+='<g clip-path="url(#frm)"><g filter="url(#emb)">'+mould+'</g></g>';
 // columns with jali lattice below springline
 var jl='';for(var y=ys+40;y<H*.98;y+=16)for(var k=0;k<2;k++){var xx=(k?x1+8:x0-38);for(var x=xx;x<xx+30;x+=15)jl+='<path d="M'+f(x+7.5)+' '+f(y)+'l7.5 8-7.5 8-7.5-8z" fill="none" stroke="#f8f5f3" stroke-width="1.3"/>'}
 body+='<g filter="url(#emb)">'+jl+'</g>';
 body+='<g filter="url(#emb)" fill="#f6f2ef"><rect x="'+f(x0-12)+'" y="'+f(ys-14)+'" width="22" height="14" rx="3"/><rect x="'+f(x1-10)+'" y="'+f(ys-14)+'" width="22" height="14" rx="3"/></g>';
 // rose clusters (soft cream roses with sage leaves)
 C.em='#f7f1ec';
 function roses(cx2,cy2,sc,dir){var g='';for(var i=0;i<9;i++){var a=dir*(-.2+i*.32),L=W*.34*sc*(.7+rnd()*.5);g+=spray(cx2,cy2,a,L,(rnd()-.5)*L*.3)}
  [[0,0,.11],[.12,.05,.08],[-.04,.11,.075],[.2,.13,.06],[.07,.2,.055],[.25,.02,.05]].forEach(function(d){g+=peony(cx2+dir*d[0]*W*sc*1.6,cy2+d[1]*W*sc*1.6,W*d[2]*sc*1.6)});return g}
 body+=roses(W*.06,H*.03,1,1)+roses(W*.94,H*.03,1,-1);
 body+=roses(W*.02,H*.93,.85,1).replace(/(cy=")([\d.]+)/g,function(m,a,b){return a+b})+roses(W*.98,H*.93,.85,-1);
 // gold line lanterns hanging from top
 function lantern(x,y,s){var g='<g fill="none" stroke="#b39a5c" stroke-width="1.2">';g+='<path d="M'+f(x)+' 0V'+f(y-s*1.1)+'"/>';
  g+='<path d="M'+f(x-s*.35)+' '+f(y-s*1.1)+'h'+f(s*.7)+'l'+f(s*.25)+' '+f(s*.35)+'h-'+f(s*1.2)+'z"/><path d="M'+f(x-s*.55)+' '+f(y-s*.75)+'C'+f(x-s*.75)+' '+f(y)+' '+f(x-s*.6)+' '+f(y+s*.6)+' '+f(x-s*.35)+' '+f(y+s*.9)+'H'+f(x+s*.35)+'C'+f(x+s*.6)+' '+f(y+s*.6)+' '+f(x+s*.75)+' '+f(y)+' '+f(x+s*.55)+' '+f(y-s*.75)+'"/><path d="M'+f(x)+' '+f(y-s*.75)+'V'+f(y+s*.9)+'M'+f(x-s*.3)+' '+f(y-s*.7)+'Q'+f(x-s*.42)+' '+f(y)+' '+f(x-s*.2)+' '+f(y+s*.88)+'M'+f(x+s*.3)+' '+f(y-s*.7)+'Q'+f(x+s*.42)+' '+f(y)+' '+f(x+s*.2)+' '+f(y+s*.88)+'"/><path d="M'+f(x-s*.3)+' '+f(y+s*.9)+'l'+f(s*.3)+' '+f(s*.35)+' '+f(s*.3)+'-'+f(s*.35)+'"/></g>';
  g+='<ellipse cx="'+f(x)+'" cy="'+f(y+s*.1)+'" rx="'+f(s*.3)+'" ry="'+f(s*.45)+'" fill="#fff3d6" opacity=".55" style="filter:blur(4px)"/>';return g}
 body+=lantern(W*.2,H*.37,26)+lantern(W*.8,H*.37,26)+lantern(W*.1,H*.44,20)+lantern(W*.9,H*.44,20);
 if(A==='archglow'){body='<g style="filter:blur(10px)">'+'<ellipse cx="'+W*.2+'" cy="'+H*.37+'" rx="28" ry="36" fill="#ffe7b0"/><ellipse cx="'+W*.8+'" cy="'+H*.37+'" rx="28" ry="36" fill="#ffe7b0"/><ellipse cx="'+W*.1+'" cy="'+H*.44+'" rx="20" ry="28" fill="#ffe7b0"/><ellipse cx="'+W*.9+'" cy="'+H*.44+'" rx="20" ry="28" fill="#ffe7b0"/></g>'}
}
if(A==='sky'){ // soft sky inside the arch
 body='<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e4ef"/><stop offset=".45" stop-color="#f3eef0"/><stop offset="1" stop-color="#efe6e2"/></linearGradient></defs><rect width="'+W+'" height="'+H+'" fill="url(#sk)"/><g style="filter:blur(50px)"><ellipse cx="'+W*.62+'" cy="'+H*.5+'" rx="'+W*.3+'" ry="'+H*.12+'" fill="#fff6ea"/></g>';
}
if(A==='details'){ // second page: paper with side vines and a small bouquet top/bottom
 body=paper()+vine(W*.09,H*.08,H*.92,1)+vine(W*.91,H*.08,H*.92,-1)+bouquet(W*.5,H*.06,W*.6,false)+bouquet(W*.5,H*.95,W*.62,false);
}

var HMODE=q.get('hm');
if(HMODE){body=body.replace(/filter="url\(#emb\)"/g,'filter="url(#hf)" style="mix-blend-mode:plus-lighter"').replace(/fill="#f[0-9a-f]{5}"/gi,'fill="#fff"').replace(/stroke="#f[0-9a-f]{5}"/gi,'stroke="#fff"');
 DEFS=DEFS.replace('</defs>','<filter id="hf" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="linearRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="'+(q.get('hb')||0.9)+'" result="b"/><feFlood flood-color="rgb(46,46,46)"/><feComposite in2="b" operator="in"/></filter></defs>');
 body='<rect width="'+W+'" height="'+H+'" fill="#000"/>'+body.replace(/<rect width="[^"]+" height="[^"]+" fill="#[0-9a-f]{6}"\/>/gi,'').replace(/<g filter="url\(#drop\)">[\s\S]*?<\/g><\/g>/,'');}
document.getElementById('out').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+DEFS+body+'</svg>';
document.title='ready';
</script></body></html>
