<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Invitation link maker</title>
<style>body{font:16px/1.4 system-ui,sans-serif;background:#0d2b2c;color:#f6efdc;margin:0;padding:20px;max-width:640px;margin:auto}h1{font-weight:500}h3{font-weight:500;margin:20px 0 4px}textarea,select,input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0;font:inherit;margin:6px 0 10px}textarea{height:110px}button,a.b{display:inline-block;background:#d9a35a;color:#2a1a08;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;text-decoration:none;margin:4px 6px 4px 0;cursor:pointer}.r{background:#ffffff14;border-radius:12px;padding:12px;margin:10px 0}.r small{display:block;word-break:break-all;opacity:.7;margin:4px 0 6px}.g{background:#ffffff0d;border-radius:12px;padding:4px 12px 2px;margin:8px 0}.g b{display:block;margin-top:8px}.hint{opacity:.65;font-size:14px}</style></head><body>
<h1>Invitation link maker</h1>
<label>Invitation<select id="w"><option value="reception">Reception only</option><option value="janti">Wedding &amp; Reception</option><option value="wedding">Wedding only</option></select></label>
<label>Language<select id="l"><option value="">English</option><option value="ne/">नेपाली (Nepali)</option></select></label>
<h3>Details (optional)</h3><div class="hint">Leave blank to keep what is already on the card. Fill in only what you want to change.</div>
<div class="g" id="gj"><b>Wedding</b><input id="jt" placeholder="Time, e.g. 11:00 AM"><input id="jv" placeholder="Venue name"><input id="jm" placeholder="Google Maps link"></div>
<div class="g" id="gr"><b>Reception</b><input id="rt" placeholder="Time (card shows 5:00 PM onwards)"><input id="rv" placeholder="Venue name"><input id="rm" placeholder="Google Maps link"></div>
<h3>Plain link (no name)</h3><div id="p"></div>
<h3>Personal links</h3>
<label>Guest names (one per line)<textarea id="t" placeholder="Tilak Dhoju and family&#10;Sita Didi"></textarea></label>
<button id="go">Make links</button><div id="o"></div>
<script>
var $=function(i){return document.getElementById(i)};
function row(title,u,msg){var d=document.createElement('div');d.className='r';d.innerHTML='<b></b><small></small>';d.firstChild.textContent=title;d.children[1].textContent=u;
var c=document.createElement('button');c.textContent='Copy link';c.onclick=function(){navigator.clipboard.writeText(u).then(function(){c.textContent='Copied ✓'})};
var w=document.createElement('a');w.className='b';w.textContent='WhatsApp';w.target='_blank';w.href='https://wa.me/?text='+encodeURIComponent(msg);
var m=document.createElement('a');m.className='b';m.textContent='Viber';m.href='viber://forward?text='+encodeURIComponent(msg);
d.append(c,w,m);return d}
function mk(u){return $('l').value?'उज्ज्वल र ब्लेसीको विवाहमा तपाईंलाई हार्दिक निमन्त्रणा। निमन्त्रणा खोल्नुहोस्: '+u:'You are warmly invited to the wedding of Ujjwal & Blesy. Open your invitation: '+u}
function url(name){var q=new URLSearchParams(),w=$('w').value,ids=w==='wedding'?['jt','jv','jm']:w==='janti'?['jt','jv','jm','rt','rv','rm']:['rt','rv','rm'];
ids.forEach(function(i){var v=$(i).value.trim();if(v)q.set(i,v)});if(name)q.set('to',name);var s=q.toString();return location.origin+'/'+$('l').value+$('w').value+'/'+(s?'?'+s:'')}
function plain(){var p=$('p');p.innerHTML='';p.appendChild(row('Anyone (no name shown)',url(),mk(url())))}
function upd(){$('gj').style.display=$('w').value==='reception'?'none':'';$('gr').style.display=$('w').value==='wedding'?'none':'';plain();$('o').innerHTML=''}
['w','l'].forEach(function(i){$(i).onchange=upd});['jt','jv','jm','rt','rv','rm'].forEach(function(i){$(i).oninput=upd});upd();
$('go').onclick=function(){var o=$('o');o.innerHTML='';
$('t').value.split('\n').map(function(s){return s.trim()}).filter(Boolean).forEach(function(n){var u=url(n);o.appendChild(row(n,u,mk(u)))})};
</script></body></html>
