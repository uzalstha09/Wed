<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Invitation link maker</title>
<style>body{font:16px/1.4 system-ui,sans-serif;background:#0d2b2c;color:#f6efdc;margin:0;padding:20px;max-width:640px;margin:auto}h1{font-weight:500}textarea,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0;font:inherit;margin:6px 0 14px}textarea{height:130px}button,a.b{display:inline-block;background:#d9a35a;color:#2a1a08;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;text-decoration:none;margin:4px 6px 4px 0;cursor:pointer}.r{background:#ffffff14;border-radius:12px;padding:12px;margin:10px 0}.r small{display:block;word-break:break-all;opacity:.7;margin:4px 0 6px}</style></head><body>
<h1>Invitation link maker</h1>
<label>Which invitation?<select id="w"><option value="reception">Reception only</option><option value="janti">Janti &amp; Reception</option></select></label>
<label>Guest names (one per line)<textarea id="t" placeholder="Tilak Dhoju and family&#10;Sita Didi"></textarea></label>
<button id="go">Make links</button><div id="o"></div>
<script>
var $=function(i){return document.getElementById(i)};
$('go').onclick=function(){var base=location.origin+'/'+$('w').value+'/',o=$('o');o.innerHTML='';
$('t').value.split('\n').map(function(s){return s.trim()}).filter(Boolean).forEach(function(n){
var u=base+'?to='+encodeURIComponent(n),msg='You are warmly invited to the wedding of Ujjwal & Blesy. Open your invitation: '+u;
var d=document.createElement('div');d.className='r';d.innerHTML='<b></b><small></small>';d.firstChild.textContent=n;d.children[1].textContent=u;
var c=document.createElement('button');c.textContent='Copy link';c.onclick=function(){navigator.clipboard.writeText(u).then(function(){c.textContent='Copied ✓'})};
var w=document.createElement('a');w.className='b';w.textContent='WhatsApp';w.target='_blank';w.href='https://wa.me/?text='+encodeURIComponent(msg);
var m=document.createElement('a');m.className='b';m.textContent='Viber';m.href='viber://forward?text='+encodeURIComponent(msg);
d.append(c,w,m);o.appendChild(d)})};
</script></body></html>
